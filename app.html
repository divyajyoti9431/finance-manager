// Fetch single NSE symbol via Yahoo Finance v8 chart (through corsproxy.io)
async function fetchYahooSymbol(sym) {
  const url = `https://corsproxy.io/?https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=1d`;
  try {
    const r = await fetch(url, {signal: AbortSignal.timeout(10000)});
    if (!r.ok) return null;
    const d = await r.json();
    const meta = d?.chart?.result?.[0]?.meta;
    if (!meta?.regularMarketPrice) return null;
    const price    = meta.regularMarketPrice;
    const prevClose= meta.chartPreviousClose || meta.previousClose || price;
    const changePct= prevClose ? ((price - prevClose) / prevClose * 100) : 0;
    return {
      symbol:    sym,
      price,
      prevClose,
      changePct,
      change:    price - prevClose,
      open:      meta.regularMarketOpen,
      high:      meta.regularMarketDayHigh,
      low:       meta.regularMarketDayLow,
      volume:    meta.regularMarketVolume,
      name:      meta.shortName,
    };
  } catch { return null; }
}

// Fetch all symbols in parallel
async function fetchYahooBatch(symbols) {
  const results = await Promise.all(symbols.map(fetchYahooSymbol));
  const map = {};
  results.forEach(r => { if (r) map[r.symbol] = r; });
  return map;
}

// Fetch ALL mutual fund NAVs in one shot from AMFI (via corsproxy)
async function fetchAMFINavs(schemeCodes) {
  try {
    const r = await fetch(
      'https://corsproxy.io/?https://www.amfiindia.com/spages/NAVAll.txt',
      {signal: AbortSignal.timeout(20000)}
    );
    if (!r.ok) return {};
    const text  = await r.text();
    const codes = new Set(schemeCodes.map(String));
    const map   = {};
    text.split('\n').forEach(line => {
      const p = line.split(';');
      if (p.length >= 5 && codes.has(p[0].trim())) {
        const nav = parseFloat(p[4].trim());
        if (!isNaN(nav)) map[parseInt(p[0].trim())] = nav;
      }
    });
    return map;
  } catch { return {}; }
}

// ── STORE ────────────────────────────────────────────────────────────────────
const Ctx = createContext();

function useLS(key, init) {
  const [v, set] = useState(() => { try { const s=localStorage.getItem(key); return s?JSON.parse(s):init; } catch { return init; } });
  const save = val => { const nv=typeof val==='function'?val(v):val; set(nv); localStorage.setItem(key,JSON.stringify(nv)); };
  return [v, save];
}

function StoreProvider({children}) {
  const [sipInvs,  setSip]   = useLS('fm_sip',   []);
  const [goldInvs, setGold]  = useLS('fm_gold',  []);
  const [stockInvs,setStock] = useLS('fm_stock', []);
  const [thresholds,setThresh]= useLS('fm_thresh',{});

  // Live data state
  const [liveP,   setLiveP]   = useState({});           // {yfSymbol: {price,change,...}}
  const [liveNav, setLiveNav] = useState({});           // {fundId: navValue}
  const [liveStatus, setLiveStatus] = useState('loading'); // 'loading'|'live'|'error'
  const [lastUpdated, setLastUpdated] = useState(null);

  const fetchAll = useCallback(async () => {
    setLiveStatus('loading');
    const stockSymbols = STOCKS.map(s=>s.yfSymbol);
    const etfSymbols   = GOLD_ETFS.map(e=>e.yfSymbol);
    const allSymbols   = [...stockSymbols, ...etfSymbols];
    const schemeCodes  = SIP_FUNDS.map(f=>f.schemeCode);

    // Fetch prices and NAVs in parallel
    const [priceMap, schemeNavMap] = await Promise.all([
      fetchYahooBatch(allSymbols),
      fetchAMFINavs(schemeCodes),
    ]);
    setLiveP(priceMap);

    // Map scheme code → fund id
    const navMap = {};
    SIP_FUNDS.forEach(f => {
      if (schemeNavMap[f.schemeCode]) navMap[f.id] = schemeNavMap[f.schemeCode];
    });
    setLiveNav(navMap);

    const success = Object.keys(priceMap).length > 0 || Object.keys(navMap).length > 0;
    setLiveStatus(success ? 'live' : 'error');
    setLastUpdated(new Date());
  }, []);

  useEffect(() => {
    fetchAll();
    const t = setInterval(fetchAll, 30 * 60 * 1000);
    return () => clearInterval(t);
  }, [fetchAll]);

  // ── Helper: get live stock data (with fallback to static)
  const getLiveStock = s => {
    const q = liveP[s.yfSymbol];
    if (!q || !q.price) return s;
    const price  = q.price;
    const upside = price > 0 ? ((s.targetPrice - price)/price*100).toFixed(1) : s.upside;
    return { ...s, currentPrice: price, change: q.changePct?.toFixed(2) ?? s.change, upside: parseFloat(upside) };
  };

  // ── Helper: get live ETF price
  const getEtfPrice = etf => liveP[etf.yfSymbol]?.price || mockGoldPrice(etf);
  const getEtfChange = etf => {
    const q = liveP[etf.yfSymbol];
    if (q && q.price && q.prevClose) return ((q.price - q.prevClose)/q.prevClose*100).toFixed(2);
    return null;
  };

  // ── Helper: get live NAV for fund
  const getFundNav = f => liveNav[f.id] || f.nav;

  // ── Valuation functions using live data
  const sipVal = i => {
    const f = SIP_FUNDS.find(f=>f.id===i.fundId);
    if (!f) return i.amount;
    const nav = liveNav[f.id];
    if (nav && i.units) return parseFloat((i.units * nav).toFixed(2));
    const d = (Date.now()-new Date(i.date))/864e5;
    return parseFloat((i.amount*Math.pow(1+(f.returns['3y']||12)/100, d/365)).toFixed(2));
  };

  const goldVal = i => {
    const e = GOLD_ETFS.find(e=>e.id===i.etfId);
    if (!e) return i.amount;
    const price = getEtfPrice(e);
    return parseFloat((i.units * price).toFixed(2));
  };

  const stockVal = i => {
    const s = STOCKS.find(s=>s.id===i.stockId);
    const price = (s && liveP[s.yfSymbol]?.price) || i.buyPrice;
    return parseFloat((price * i.quantity).toFixed(2));
  };

  const addSIP   = i => setSip(p=>[...p,{...i,id:Date.now()}]);
  const addGold  = i => setGold(p=>[...p,{...i,id:Date.now()}]);
  const addStock = i => setStock(p=>[...p,{...i,id:Date.now()}]);
  const removeSIP   = id => setSip(p=>p.filter(i=>i.id!==id));
  const removeGold  = id => setGold(p=>p.filter(i=>i.id!==id));
  const removeStock = id => setStock(p=>p.filter(i=>i.id!==id));
  const setThreshold   = (eid,v) => setThresh(p=>({...p,[eid]:parseFloat(v)}));
  const clearThreshold = eid     => setThresh(p=>{ const n={...p}; delete n[eid]; return n; });

  const sipTotal  = sipInvs.reduce((s,i)=>s+i.amount,0);
  const goldTotal = goldInvs.reduce((s,i)=>s+i.amount,0);
  const stockTotal= stockInvs.reduce((s,i)=>s+i.amount,0);
  const sipCur    = sipInvs.reduce((s,i)=>s+sipVal(i),0);
  const goldCur   = goldInvs.reduce((s,i)=>s+goldVal(i),0);
  const stockCur  = stockInvs.reduce((s,i)=>s+stockVal(i),0);
  const totalInv  = sipTotal+goldTotal+stockTotal;
  const totalCur  = sipCur+goldCur+stockCur;
  const pnl       = totalCur-totalInv;
  const pnlPct    = totalInv>0 ? (pnl/totalInv)*100 : 0;

  const alerts = GOLD_ETFS.flatMap(e => {
    const t=thresholds[e.id]; if (t===undefined) return [];
    const p=getEtfPrice(e);
    return p<=t ? [{etfId:e.id,etfName:e.name,symbol:e.symbol,currentPrice:p,threshold:t}] : [];
  });

  return (
    <Ctx.Provider value={{
      sipInvs,goldInvs,stockInvs,thresholds,
      addSIP,addGold,addStock,removeSIP,removeGold,removeStock,setThreshold,clearThreshold,
      sipVal,goldVal,stockVal,getLiveStock,getEtfPrice,getEtfChange,getFundNav,
      sipTotal,goldTotal,stockTotal,sipCur,goldCur,stockCur,totalInv,totalCur,pnl,pnlPct,
      alerts,liveStatus,lastUpdated,fetchAll,liveP,liveNav,

const riskColor = r => ({Low:'bg-green-100 text-green-700',Moderate:'bg-blue-100 text-blue-700','Moderate-High':'bg-yellow-100 text-yellow-700',High:'bg-orange-100 text-orange-700','Very High':'bg-red-100 text-red-700'}[r]||'bg-slate-100 text-slate-700');

function LiveBadge() {
  const {liveStatus, lastUpdated, fetchAll} = useStore();
  const [countdown, setCountdown] = useState('');

  useEffect(() => {
    if (!lastUpdated || liveStatus !== 'live') { setCountdown(''); return; }
    const tick = () => {
      const elapsed = Math.floor((Date.now() - new Date(lastUpdated)) / 1000);
      const remaining = 30 * 60 - elapsed;
      if (remaining <= 0) { setCountdown('updating…'); return; }
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      setCountdown(`next in ${m}:${String(s).padStart(2,'0')}`);
    };
    tick();
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  }, [lastUpdated, liveStatus]);

  return (
    <div className="flex items-center gap-2">
      {liveStatus==='loading' && (
        <span className="flex items-center gap-1.5 text-xs text-amber-600 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-full">
          <span className="live-pulse inline-block w-1.5 h-1.5 rounded-full bg-amber-400"></span>Fetching live data…
        </span>
      )}
      {liveStatus==='live' && (
        <span className="flex items-center gap-1.5 text-xs text-green-700 bg-green-50 border border-green-200 px-2.5 py-1 rounded-full">
          <span className="inline-block w-1.5 h-1.5 rounded-full bg-green-500"></span>
          Live · {fmtTime(lastUpdated)}&nbsp;·&nbsp;<span className="text-green-600 opacity-70">{countdown}</span>
        </span>
      )}
      {liveStatus==='error' && (
        <span className="flex items-center gap-1.5 text-xs text-red-600 bg-red-50 border border-red-200 px-2.5 py-1 rounded-full">
          <span className="inline-block w-1.5 h-1.5 rounded-full bg-red-400"></span>Offline prices
        </span>
      )}
      <button onClick={fetchAll} title="Refresh now" className="text-slate-400 hover:text-blue-500 text-base leading-none" style={{lineHeight:1}}>↻</button>
    </div>
  );
}

            <tr><th className="px-4 py-2.5 text-left">ETF</th><th className="px-4 py-2.5 text-right">Price</th><th className="px-4 py-2.5 text-right">Change</th><th className="px-4 py-2.5 text-right">Prev Close</th><th className="px-4 py-2.5 text-right">AUM</th><th className="px-4 py-2.5 text-right">Exp%</th><th className="px-4 py-2.5 text-right">Threshold</th><th className="px-4 py-2.5 text-center">Actions</th></tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {GOLD_ETFS.map(etf=>{
              const cur      = getEtfPrice(etf);
              const chgPct   = getEtfChange(etf);
              const liveQ    = liveP[etf.yfSymbol];
              const prevClose= liveQ?.prevClose;
              const diff     = chgPct !== null ? parseFloat(chgPct) : ((cur-etf.basePrice)/etf.basePrice*100);
              const up       = diff >= 0;
              const thresh   = thresholds[etf.id];
              const isAlert  = thresh!==undefined && cur<=thresh;
              const isLive   = !!liveQ?.price;
              return(
                <tr key={etf.id} className={`hover:bg-slate-50 ${isAlert?'bg-amber-50':''}`}>
                  <td className="px-4 py-3">
                    <div className="flex items-center gap-2">
                      {isAlert && <span>⚡</span>}
                      <div>
                        <div className="font-medium text-slate-800 text-sm">{etf.symbol}</div>
                        <div className="text-xs text-slate-400">{etf.amc}</div>
                      </div>
                      {isLive && <span className="text-xs text-green-600 font-semibold ml-1">●</span>}
                    </div>
                  </td>
                  <td className="px-4 py-3 text-right font-bold text-slate-800">₹{cur.toFixed(2)}</td>
                  <td className="px-4 py-3 text-right">
                    <span className={`text-sm font-medium ${up?'text-green-600':'text-red-600'}`}>{up?'▲':'▼'} {Math.abs(diff).toFixed(2)}%</span>
                  </td>
                  <td className="px-4 py-3 text-right text-sm text-slate-500">{prevClose?`₹${prevClose.toFixed(2)}`:'—'}</td>
                  <td className="px-4 py-3 text-right text-sm text-slate-500">{etf.aum}</td>
                  <td className="px-4 py-3 text-right text-sm text-slate-500">{etf.expense}%</td>
                  <td className="px-4 py-3 text-right">
                    {thresh!==undefined
                      ?<div className="flex items-center justify-end gap-1"><span className={`text-sm font-medium ${isAlert?'text-amber-600':'text-slate-600'}`}>₹{thresh}</span><button onClick={()=>clearThreshold(etf.id)} className="text-slate-300 hover:text-red-400 text-xs ml-1">✕</button></div>
                      :<span className="text-xs text-slate-400">Not set</span>}
                  </td>
                  <td className="px-4 py-3 text-center">
                    <div className="flex items-center justify-center gap-2">
                      <button onClick={()=>{setTModal({etf,cur});setTv('');}} className="text-xs bg-amber-100 hover:bg-amber-200 text-amber-700 px-2.5 py-1 rounded-lg font-medium">Set Alert</button>
                      <button onClick={()=>{setBModal({etf,cur});setBf({qty:'10',date:new Date().toISOString().slice(0,10)});}} className="text-xs bg-green-500 hover:bg-green-600 text-white px-2.5 py-1 rounded-lg font-medium">Buy</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="bg-blue-50 border border-blue-100 rounded-xl p-4 flex gap-3 text-sm text-blue-800">
        <span className="shrink-0">💡</span>
        <span><strong>Tip:</strong> Set threshold 2-5% below current price. Alert fires when gold drops to your level. Green ● = Live NSE price.</span>
      </div>

      {tModal&&(
        <Modal title="Set Buy Threshold" sub={tModal.etf.name} onClose={()=>setTModal(null)}>
          <form onSubmit={e=>{e.preventDefault();setThreshold(tModal.etf.id,tv);setTModal(null);}} className="space-y-4">
            <div className="bg-slate-50 rounded-lg p-3 text-sm flex justify-between"><span>Current Price (Live)</span><strong className="text-green-700">₹{tModal.cur.toFixed(2)}</strong></div>
            <div><label className="block text-sm font-medium text-slate-700 mb-1">Alert when price drops to (₹)</label>
              <input type="number" value={tv} onChange={e=>setTv(e.target.value)} step="0.01" placeholder={`e.g. ${(tModal.cur*0.97).toFixed(2)}`} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" required/></div>
            <div className="flex gap-3"><button type="button" onClick={()=>setTModal(null)} className="flex-1 border border-slate-200 text-slate-600 rounded-lg py-2 text-sm">Cancel</button><button type="submit" className="flex-1 bg-amber-500 text-white rounded-lg py-2 text-sm font-medium hover:bg-amber-600">Set Threshold</button></div>
          </form>
        </Modal>
      )}

      {bModal&&(
        <Modal title="Buy Gold ETF" sub={`${bModal.etf.name} (${bModal.etf.symbol})`} onClose={()=>setBModal(null)}>
          <form onSubmit={e=>{e.preventDefault();addGold({etfId:bModal.etf.id,etfName:bModal.etf.name,symbol:bModal.etf.symbol,units:parseFloat(bf.qty),buyPrice:bModal.cur,amount:parseFloat((bf.qty*bModal.cur).toFixed(2)),date:bf.date});setBModal(null);}} className="space-y-4">
            <div><label className="block text-sm font-medium text-slate-700 mb-1">Units</label><input type="number" value={bf.qty} onChange={e=>setBf({...bf,qty:e.target.value})} min="1" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" required/></div>
            <div><label className="block text-sm font-medium text-slate-700 mb-1">Date</label><input type="date" value={bf.date} onChange={e=>setBf({...bf,date:e.target.value})} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" required/></div>
            <div className="bg-amber-50 rounded-lg p-3 text-xs space-y-1">
              <div className="flex justify-between"><span>Live Price/unit</span><span className="text-green-700 font-medium">₹{bModal.cur.toFixed(2)}</span></div>
              <div className="flex justify-between font-bold border-t border-amber-100 pt-1"><span>Total</span><span>{fmt(bf.qty*bModal.cur)}</span></div>
            </div>
            <div className="flex gap-3"><button type="button" onClick={()=>setBModal(null)} className="flex-1 border border-slate-200 text-slate-600 rounded-lg py-2 text-sm">Cancel</button><button type="submit" className="flex-1 bg-amber-500 text-white rounded-lg py-2 text-sm font-medium hover:bg-amber-600">Confirm Buy</button></div>
          </form>
        </Modal>
      )}
    </div>
  );
}

// ── STOCK PICKER ──────────────────────────────────────────────────────────────

                        <td className="px-4 py-3"><PnLCell amount={inv.amount} cur={cv}/></td>
                        <td className="px-4 py-3 text-right text-xs text-slate-400">{new Date(inv.date).toLocaleDateString('en-IN')}</td>
                        <td className="px-4 py-3 text-center"><button onClick={()=>removeGold(inv.id)} className="text-xs text-slate-400 hover:text-red-500 px-2 py-1 rounded hover:bg-red-50">Remove</button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {(tab==='all'||tab==='stocks')&&(
        <div className="mb-5">
          {tab==='all'&&<div className="text-sm font-semibold text-slate-700 mb-2">📊 Stocks</div>}
          {stockInvs.length===0?<Empty label="Stock" pg="stocks"/>:(
            <div className="bg-white rounded-xl border border-slate-100 shadow-sm overflow-auto">
              <table className="w-full">
                <thead className="bg-slate-50 text-xs text-slate-500 uppercase"><tr><th className="px-4 py-2.5 text-left">Stock</th><th className="px-4 py-2.5 text-right">Qty</th><th className="px-4 py-2.5 text-right">Buy</th><th className="px-4 py-2.5 text-right">Live CMP</th><th className="px-4 py-2.5 text-right">Target</th><th className="px-4 py-2.5 text-right">Stop Loss</th><th className="px-4 py-2.5 text-right">Invested</th><th className="px-4 py-2.5 text-right">Cur. Value</th><th className="px-4 py-2.5 text-right">P&L</th><th className="px-4 py-2.5 text-right">Date</th><th className="px-4 py-2.5 text-center">—</th></tr></thead>
                <tbody className="divide-y divide-slate-50">
                  {stockInvs.map(inv=>{
                    const curPrice = getStockCurPrice(inv);
                    const isLive = curPrice !== inv.buyPrice;
                    const cv = stockVal(inv);
                    return(
                      <tr key={inv.id} className="hover:bg-slate-50">
                        <td className="px-4 py-3"><div className="font-bold text-slate-800 text-sm">{inv.symbol}</div><div className="text-xs text-slate-400">{inv.sector}</div></td>
                        <td className="px-4 py-3 text-right text-sm">{inv.quantity}</td>
                        <td className="px-4 py-3 text-right text-sm">₹{inv.buyPrice.toLocaleString('en-IN')}</td>
                        <td className="px-4 py-3 text-right text-sm">{isLive ? <span className="text-green-700 font-medium">₹{curPrice.toLocaleString('en-IN')}</span> : <span className="text-slate-400">—</span>}</td>
                        <td className="px-4 py-3 text-right text-sm text-green-600 font-medium">₹{inv.targetPrice.toLocaleString('en-IN')}</td>
                        <td className="px-4 py-3 text-right text-sm text-red-500">₹{inv.stopLoss.toLocaleString('en-IN')}</td>
                        <td className="px-4 py-3 text-right text-sm font-medium">{fmt(inv.amount)}</td>
                        <td className="px-4 py-3 text-right text-sm font-semibold">{fmt(cv)}</td>
                        <td className="px-4 py-3"><PnLCell amount={inv.amount} cur={cv}/></td>
                        <td className="px-4 py-3 text-right text-xs text-slate-400">{new Date(inv.date).toLocaleDateString('en-IN')}</td>
                        <td className="px-4 py-3 text-center"><button onClick={()=>removeStock(inv.id)} className="text-xs text-slate-400 hover:text-red-500 px-2 py-1 rounded hover:bg-red-50">Remove</button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [page, setPage] = useState('dashboard');
  return(
    <div className="flex h-screen overflow-hidden">
      <Sidebar page={page} setPage={setPage}/>
      <main className="flex-1 overflow-y-auto bg-slate-100">
        {page==='dashboard' && <Dashboard setPage={setPage}/>}
        {page==='sip'       && <SIPManager/>}
        {page==='gold'      && <GoldETF/>}
        {page==='stocks'    && <StockPicker/>}
        {page==='portfolio' && <Portfolio setPage={setPage}/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <StoreProvider><App/></StoreProvider>
);
</script>
</body>
</html>
